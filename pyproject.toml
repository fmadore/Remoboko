[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule set well beyond the pycodestyle
# and Pyflakes checks this project has always linted against. State the
# selection explicitly so a new ruff release cannot turn CI red without a
# single line of code changing.
select = ["E4", "E7", "E9", "F"]

# E402: scripts insert the repo root into sys.path before importing viz_common
ignore = ["E402"]
