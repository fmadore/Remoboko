name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  print-figures:
    name: Python print figures
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt "ruff>=0.16,<0.17"

      - name: Lint
        run: ruff check .

      - name: Run print-figure scripts
        run: |
          python Book_DeGruyter/Timeline/timeline.py
          python "Final report/collaborators_gender.py"
          python .github/assets/social_preview.py

      # word_clouds.py needs the ~570 MB spaCy French model, so CI only
      # checks that it compiles.
      - name: Compile-check word cloud script
        run: python -m py_compile "Final report/word_clouds.py"

  interactive-figures:
    name: Interactive figures (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke-test every figure page
        run: npm test
