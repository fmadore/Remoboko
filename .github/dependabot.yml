version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      test-tooling:
        patterns: ["*"]
        exclude-patterns: [d3, maplibre-gl]
    # D3 and MapLibre updates must also update their pinned browser URLs.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-figures:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
