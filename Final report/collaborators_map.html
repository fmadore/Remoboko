  <meta name="description" content="The 93 Remoboko collaborators located by their institution, with circles sized by headcount.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="rb-map-page">
<!--
THESIS: The figure is the page. One question answered in seconds, no chrome, nothing decorative; refuses the dashboard-card arrangement and the Plotly toolbar.
OWN-WORLD: White ground, Source Sans 3, hairline grid, near-black ink with two greys, one validated categorical palette plus the pinned country trio. Legends are text keys with small swatches; controls are text links and a segmented toggle.
STORY: A blog reader lands inside an iframe, sees where the project's collaborators work, hovers a circle for the institution, clicks for the names, returns to the post.
FIRST VIEWPORT: A light world map filling the frame with every institution visible (a phone is narrower than the world at the minimum zoom, so it opens on the Atlantic hemisphere); title strip across the top, basemap switch top-right, the circle size key bottom-left, collapsed to a toggle on phones.
FORM: Plain editorial charts (the canon, Datawrapper as the bar), chosen by the user over the assigned road-map sheet; seed 7067b968.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<header class="rb-map-head" id="title-card"></header>
<div class="rb-map-body">
  <div id="map" role="application" aria-label="Interactive world map of collaborators by institution"></div>
  <div class="rb-card rb-card--tools" id="tools-card"></div>
  <section class="rb-card rb-card--legend" id="legend-card" aria-label="Legend"></section>
</div>
<script type="module" src="collaborators_map.js"></script>
</body>
</html>
