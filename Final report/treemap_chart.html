<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications and activities by type and language · Remoboko</title>
  <meta name="description" content="Treemap of Remoboko's 181 publications and activities by type, language and year.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/remoboko.css">
  <style>
    .rb-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin: 0; padding: 0; list-style: none; font-size: var(--rb-fs-label); color: var(--rb-ink-3); }
    .rb-crumbs button { padding: 2px 4px; border: 0; background: none; color: var(--rb-link); cursor: pointer; border-radius: 2px; text-decoration: underline; text-underline-offset: 0.15em; }
    .rb-crumbs button:hover { background: var(--rb-hover); }
    .rb-crumbs li[aria-current="true"] { color: var(--rb-ink); font-weight: 600; padding: 2px 4px; }
    .rb-crumbs li + li::before { content: "›"; margin-right: 4px; color: var(--rb-ink-3); }
    .cell { cursor: pointer; }
    .cell rect { stroke: var(--rb-surface); stroke-width: 2px; transition: opacity 0.15s var(--rb-ease); }
    .cell.is-dim rect { opacity: 0.45; }
    .cell text { pointer-events: none; }
    .cell .name { font-size: var(--rb-fs-label); font-weight: 600; }
    .cell .count { font-size: var(--rb-fs-small); }
  </style>
</head>
<body>
<!--
THESIS: The figure is the page. One question answered in seconds, no chrome, nothing decorative; refuses the dashboard-card arrangement and the Plotly toolbar.
OWN-WORLD: White ground, Source Sans 3, hairline grid, near-black ink with two greys, one validated categorical palette plus the pinned country trio. Legends are text keys with small swatches; controls are text links and a segmented toggle.
STORY: A blog reader lands inside an iframe, reads title and description, scans the marks, hovers for detail, opens the table or downloads, returns to the post.
FIRST VIEWPORT: Title top-left, description under it, the type legend and a breadcrumb on one row, the treemap filling the remaining height, source line and actions in a hairline-topped footer.
FORM: Plain editorial charts (the canon, Datawrapper as the bar), chosen by the user over the assigned road-map sheet; seed 7067b968.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<figure class="rb-figure">
  <figcaption class="rb-head">
    <h1 class="rb-title">Publications and activities by type and language</h1>
    <p class="rb-desc" id="desc">Every output of the project, sized by count. Click a type to break it down by language, then by year.</p>
  </figcaption>
  <div class="rb-controls">
    <div id="legend"></div>
    <ol class="rb-crumbs" id="crumbs" aria-label="Current level" style="margin-left:auto"></ol>
  </div>
  <div class="rb-plot" id="plot"></div>
  <footer class="rb-foot">
    <p class="rb-notes" id="notes">Source: Remoboko project data (CC BY 4.0).</p>
    <div class="rb-actions" id="actions"></div>
  </footer>
</figure>
<script type="module" src="treemap_chart.js"></script>
</body>
</html>
